 ctx.moveTo(-16,17);ctx.lineTo(-23-walk*8,37);ctx.moveTo(17,17);ctx.lineTo(24+walk*8,36);ctx.stroke();

function drawJaguar(x,y,t,face=1,moving=false){
 ctx.save();ctx.translate(x,y);ctx.scale(face,1);
 // Ground is y=GROUND-2: paws must meet the ground, never follow Diego's jump.

 }
 // round golden body

 // jaguar rosettes rather than generic dots
 ctx.strokeStyle='#624029';ctx.lineWidth=2.7;

  ctx.beginPath();ctx.arc(sx,sy,3.8,.2,2.6);ctx.stroke();ctx.beginPath();ctx.arc(sx,sy,3.8,3.3,5.6);ctx.stroke();
 }
 // head, rounded ears, cheeks

 for(const ex of [10,37]){ctx.fillStyle='#d9983c';ctx.beginPath();ctx.arc(ex,-57,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8b5a35';ctx.beginPath();ctx.arc(ex,-57,4.5,0,Math.PI*2);ctx.fill()}

 ctx.beginPath();ctx.arc(29,-35,3.5,0,Math.PI*2);ctx.fill();

 // whiskers

 ctx.restore();
}
