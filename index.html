<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#227c49"><title>Diegos Dschungel-Abenteuer</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,Arial;touch-action:none;background:#174a34}canvas{width:100vw;height:100dvh;display:block}button{font:inherit;touch-action:none}.controls{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:16px;display:flex;gap:12px}.controls button,.jump{width:76px;height:76px;border:4px solid white;border-radius:50%;background:#0788da;color:white;font-size:35px;font-weight:900;box-shadow:0 4px 0 #164e78}.jump{position:fixed;right:18px;bottom:max(12px,env(safe-area-inset-bottom));background:#47b52d}.top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}.mission{max-width:440px;background:#fff6d8;border:3px solid #a97029;border-radius:20px;padding:10px 15px;font-size:clamp(13px,2vw,18px);font-weight:700;color:#264d39;box-shadow:0 4px 0 #805321;pointer-events:auto}.menu{display:flex;gap:7px;pointer-events:auto}.menu button,.action{border:3px solid #fff;border-radius:20px;background:#ffbb3d;color:#243f34;font-size:18px;font-weight:800;padding:9px 13px;box-shadow:0 4px 0 #966620}.overlay{position:fixed;inset:0;background:#073821ad;display:flex;align-items:center;justify-content:center;padding:15px}.panel{background:#fff8dc;border:5px solid #df9b3c;border-radius:25px;padding:22px;max-width:540px;width:100%;max-height:90dvh;overflow:auto;text-align:center;color:#204e37;box-shadow:0 10px 0 #8d5a27}.panel h1{font-size:clamp(24px,4vw,35px);margin:5px 0 10px}.panel p{font-size:19px}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.choices button{min-width:110px;min-height:85px;border:3px solid #d18b2d;border-radius:20px;background:#fff;font-size:22px;font-weight:bold;color:#245239}.hidden{display:none!important}.hint{font-size:14px!important}.status{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#fff4ce;border:3px solid #b27c36;border-radius:16px;padding:9px 14px;font-weight:bold;color:#254c35;pointer-events:none;max-width:50%;text-align:center}@media(max-width:650px){.controls button,.jump{width:60px;height:60px;font-size:28px}.mission{max-width:48vw}.menu button{font-size:14px;padding:7px}.status{bottom:80px;font-size:12px}.panel{padding:13px}.panel p{font-size:16px}}</style></head><body><canvas id="game"></canvas><div class="top"><div class="mission" id="mission">🐾 Mission 1: Finde Seil und Brett. Rette das Jaguarbaby!</div><div class="menu"><button id="speak">🔊</button><button id="bag">🎒 <span id="count">0/2</span></button><button id="help">❔</button></div></div><div class="controls"><button id="left" aria-label="Links">◀</button><button id="right" aria-label="Rechts">▶</button></div><button class="jump" id="jump" aria-label="Springen">⬆</button><div class="status" id="status">Bewege Diego mit den Pfeilen!</div><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W=960,H=540,scale=1,cam=0,last=0,paused=true,phase='intro',inventory=new Set(),win=false;const world=2050,ground=425;const hero={x:90,y:ground-76,vy:0,w:48,h:76,on:true,face:1};const keys={left:false,right:false,jump:false};const objects=[{id:'rope',x:450,emoji:'🪢',name:'Seil'},{id:'plank',x:860,emoji:'🪵',name:'Holzbrett'}];const el=id=>document.getElementById(id);function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;W=960;H=540;scale=Math.min(canvas.width/W,canvas.height/H)}addEventListener('resize',resize);resize();function speak(s){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='de-DE';u.rate=.87;speechSynthesis.speak(u)}}function modal(html){paused=true;el('panel').innerHTML=html;el('overlay').classList.remove('hidden')}function close(){el('overlay').classList.add('hidden');paused=false}function start(){phase='explore';close();speak('Los geht’s! Finde das Seil und das Holzbrett.')}function intro(){modal('<h1>🌴 Diegos Dschungel-Abenteuer</h1><p>Hallo Tierretter! 🐆 Ein kleines Jaguarbaby braucht Hilfe auf der anderen Seite des Flusses.</p><p>Suche ein <b>Seil</b> und ein <b>Holzbrett</b> und baue einen sicheren Weg!</p><button class="action" onclick="start()">▶ Abenteuer starten</button><p class="hint">iPad: große Tasten · Computer: Pfeile und Leertaste · Keine Zeitlimits</p>')}function status(s){el('status').textContent=s}function collected(o){inventory.add(o.id);el('count').textContent=inventory.size+'/2';status('Super! '+o.name+' eingesammelt! ⭐');speak(o.name+' gefunden!')}function bridge(){phase='puzzle';modal('<h1>🌊 Am Fluss!</h1><p>Das Jaguarbaby wartet drüben. Was brauchen wir, um den Baumstamm sicher als Brücke zu befestigen?</p><div class="choices"><button onclick="answer(\'rope\')">🪢<br>Seil</button><button onclick="answer(\'plank\')">🪵<br>Brett</button><button onclick="answer(\'leaf\')">🍃<br>Blatt</button></div><p class="hint">Tippe auf den richtigen Gegenstand.</p>');speak('Was brauchen wir, um den Baumstamm sicher als Brücke zu befestigen?')}function answer(a){if(a==='rope'){phase='bridge';modal('<h1>🎉 Das klappt!</h1><p>Mit dem Seil befestigen wir den Baumstamm. Jetzt können wir sicher hinüberlaufen!</p><button class="action" onclick="cross()">🐾 Zum Jaguarbaby!</button>');speak('Toll gemacht! Die Brücke ist jetzt sicher!')}else{status('Fast! Probiere einen anderen Gegenstand.');speak('Versuch es noch einmal!')}}function cross(){phase='saved';hero.x=1690;close();status('Laufe zum Jaguarbaby! 🐆');speak('Jetzt schnell zum Jaguarbaby!')}function rescued(){if(win)return;win=true;phase='done';localStorage.setItem('diego_jaguar_saved','yes');modal('<h1>🏆 Mission geschafft!</h1><p>Du hast das Jaguarbaby gerettet! 🐆💛</p><h2>Tierwissen: Jaguar</h2><p>Jaguare können sehr gut schwimmen. Ihr geflecktes Fell hilft ihnen, sich im Dschungel zu verstecken.</p><button class="action" onclick="restart()">🔄 Noch einmal spielen</button>');speak('Hurra! Du hast das Jaguarbaby gerettet! Jaguare können sogar schwimmen!')}function restart(){inventory.clear();win=false;phase='explore';hero.x=90;hero.y=ground-76;hero.vy=0;el('count').textContent='0/2';close();status('Neues Abenteuer! Sammle Seil und Brett.')}function bag(){modal('<h1>🎒 Mein Rucksack</h1><p>'+(inventory.size?[...inventory].map(v=>v==='rope'?'🪢 Seil':'🪵 Holzbrett').join('<br>'):'Noch leer! Suche Gegenstände im Dschungel.')+'</p><button class="action" onclick="close()">Weiter spielen</button>')}function help(){modal('<h1>💡 So geht’s</h1><p>◀ ▶ zum Laufen · ⬆ zum Springen.<br>Berühre Gegenstände beim Vorbeilaufen, um sie einzusammeln.</p><p>Finde 🪢 und 🪵, dann laufe zum Fluss. Es gibt keine verlorenen Leben!</p><button class="action" onclick="close()">Weiter spielen</button>')}el('bag').onclick=bag;el('help').onclick=help;el('speak').onclick=()=>speak(phase==='explore'?'Finde das Seil und das Holzbrett. Laufe nach rechts zum Fluss.':phase==='saved'?'Laufe zum Jaguarbaby!':'Hilf dem Jaguarbaby!');for(let id of ['left','right','jump']){let b=el(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[id]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[id]=false)}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyW'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=true});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=false});function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#82d9e6';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,(canvas.width-W*scale)/2,(canvas.height-H*scale)/2);let sky=ctx.createLinearGradient(0,0,0,480);sky.addColorStop(0,'#72cce9');sky.addColorStop(1,'#d5efac');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam*.3,0);for(let i=0;i<32;i++){let x=i*125-100;ctx.fillStyle=i%2?'#58ac6c':'#429e64';ctx.beginPath();ctx.ellipse(x,330,100,170,0,0,Math.PI*2);ctx.fill()}ctx.restore();ctx.save();ctx.translate(-cam,0);for(let i=0;i<27;i++){let x=i*85;ctx.fillStyle=i%2?'#226c3e':'#277b42';ctx.beginPath();ctx.ellipse(x,395,60,70,0,0,7);ctx.fill();ctx.fillStyle='#b27b41';ctx.fillRect(x+15,260,18,160);ctx.fillStyle='#29984b';ctx.beginPath();ctx.arc(x+20,270,64,0,7);ctx.fill()}ctx.fillStyle='#8bc647';ctx.fillRect(0,ground,world,24);ctx.fillStyle='#a87841';ctx.fillRect(0,ground+24,world,110);for(let i=0;i<75;i++){let x=i*31;ctx.fillStyle=i%3?'#377d39':'#d1a34e';ctx.fillRect(x,ground+26+(i%4)*12,15,5)}for(let o of objects){if(!inventory.has(o.id)){ctx.font='53px serif';ctx.fillText(o.emoji,o.x,ground-30);ctx.fillStyle='#fff7d6';ctx.fillRect(o.x-8,ground-105,105,27);ctx.fillStyle='#245239';ctx.font='bold 17px Arial';ctx.fillText(o.name,o.x,ground-85)}}ctx.fillStyle='#188bd0';ctx.fillRect(1190,ground,420,120);for(let i=0;i<12;i++){ctx.fillStyle='#b4f5f9';ctx.fillRect(1190+i*38,ground+13+(i%3)*16,27,5)}ctx.fillStyle=phase==='bridge'||phase==='saved'||phase==='done'?'#98612e':'#c59c67';ctx.save();ctx.translate(1195,ground-4);ctx.rotate(-.03);ctx.fillRect(0,-12,415,24);ctx.restore();ctx.fillStyle='#e8f4b4';ctx.font='bold 22px Arial';ctx.fillText('🌊 Fluss',1320,ground-95);ctx.font='66px serif';ctx.fillText('🐆',1820,ground-12);ctx.fillStyle='#fff7da';ctx.fillRect(1790,ground-120,190,36);ctx.fillStyle='#234c36';ctx.font='bold 19px Arial';ctx.fillText('Jaguarbaby!',1800,ground-96);let x=hero.x,y=hero.y;ctx.font='65px serif';ctx.fillText('🧒🏽',x-6,y+64);ctx.font='49px serif';ctx.fillText('🐆',x-68,y+70);ctx.restore();}function tick(t){let dt=Math.min((t-last)/16.67||1,2);last=t;if(!paused){if(keys.left){hero.x-=4.8*dt;hero.face=-1}if(keys.right){hero.x+=4.8*dt;hero.face=1}if(keys.jump&&hero.on){hero.vy=-12.5;hero.on=false}hero.vy+=.63*dt;hero.y+=hero.vy*dt;if(hero.y>=ground-76){hero.y=ground-76;hero.vy=0;hero.on=true}hero.x=Math.max(35,Math.min(world-70,hero.x));if(phase==='explore'){for(let o of objects)if(!inventory.has(o.id)&&Math.abs(hero.x-o.x)<62)collected(o);if(hero.x>1130){hero.x=1130;if(inventory.size===2)bridge();else{status('Erst Seil und Brett sammeln!');hero.x=1090}}}if(phase==='saved'&&hero.x>1770)rescued();cam=Math.max(0,Math.min(world-W,hero.x-W*.37))}draw();requestAnimationFrame(tick)}intro();requestAnimationFrame(tick);
</script></body></html>
